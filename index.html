<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Cellentio — Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1A5CF0; --blue-d:#0F44C0; --blue-50:#EDF3FF; --blue-100:#D7E4FF; --blue-200:#B4CCFF;
  --cyan:#13C6F2; --cyan-50:#E4F8FE;
  --violet:#7B4DF2; --violet-50:#F1EBFF;
  --gold:#FFC21A; --gold-50:#FFF7DC;
  --green:#12A26B; --green-50:#E2F7EE;
  --red:#E5484D; --red-50:#FDECEC;
  --orange:#EE8420; --orange-50:#FFF1E2;
  --ink:#0E1150; --ink-2:#4A4F7A; --muted:#8A90B2; --line:#E4EAF6;
  --bg:#F5F8FF; --card:#FFFFFF;
  --grad:linear-gradient(120deg,#0A5CFF 0%,#13C6F2 100%);
  --r:16px; --r-sm:11px;
  --shadow:0 1px 0 rgba(14,17,80,.03), 0 10px 26px -16px rgba(26,92,240,.28);
  --font-h:'Lexend', system-ui, sans-serif;
  --font-b:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
h1,h2,h3,h4{font-family:var(--font-h);font-weight:600;line-height:1.2;letter-spacing:-.1px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--blue);text-decoration:none}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media(max-width:600px){.g2{grid-template-columns:1fr}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:11px;font-weight:700;font-size:14px;background:var(--blue);color:#fff;box-shadow:0 6px 16px -8px rgba(26,92,240,.7);transition:transform .08s, filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn svg{width:17px;height:17px}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--blue-200);color:var(--blue)}
.btn.soft{background:var(--blue-50);color:var(--blue-d);box-shadow:none}
.btn.green{background:var(--green);box-shadow:0 6px 16px -8px rgba(18,162,107,.7)}
.btn.red{background:var(--red);box-shadow:0 6px 16px -8px rgba(229,72,77,.7)}
.btn.zoom{background:#0B5CFF}
.btn.block{width:100%}
.btn:disabled{opacity:.55;pointer-events:none}
.icon-btn{width:36px;height:36px;border-radius:10px;display:inline-grid;place-items:center;color:var(--ink-2);position:relative;flex-shrink:0}
.icon-btn:hover{background:var(--blue-50);color:var(--blue)}
.icon-btn svg{width:19px;height:19px}
.icon-btn .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #fff}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--muted)}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;outline:none;transition:border-color .15s, box-shadow .15s;min-width:0}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-50)}
textarea.input{min-height:96px;resize:vertical;line-height:1.55}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
@media(max-width:560px){.form-grid{grid-template-columns:1fr}}
.check{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--blue)}
.search{position:relative;flex:1;min-width:180px;max-width:320px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.search .input{padding-left:36px}

/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid #E9EEF9;padding:18px;min-width:0}
.card h3{font-size:17px;margin-bottom:10px}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-head h3{margin:0}
.stat{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:3px;min-width:0;background:#fff;border:1px solid #E9EEF9;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--blue))}
.stat .lbl{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.stat .val{font-family:var(--font-h);font-size:26px;font-weight:600;line-height:1.15;color:var(--ink)}
.stat .sub{font-size:12px;color:var(--muted)}
.stat.click{cursor:pointer}
.stat.click:hover{border-color:var(--blue-200)}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-green{background:var(--green-50);color:#0B7A4F}
.b-red{background:var(--red-50);color:#B4282D}
.b-yellow{background:var(--gold-50);color:#8A6500}
.b-blue{background:var(--blue-50);color:var(--blue-d)}
.b-violet{background:var(--violet-50);color:#5B32B0}
.b-orange{background:var(--orange-50);color:#A95A0C}
.b-gray{background:#EEF1F7;color:var(--ink-2)}

/* table */
.table-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.warn td{background:#FFF8F8}
.t tr.warn td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.t .c{text-align:center}
.t .r{text-align:right}
.t td.acts{white-space:nowrap;text-align:right}
.code{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:var(--blue-50);padding:2px 7px;border-radius:6px;color:var(--blue-d)}

/* tabs / chips */
.tabs{display:flex;gap:4px;background:#fff;padding:4px;border-radius:12px;box-shadow:var(--shadow);border:1px solid #E9EEF9;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs button{padding:7px 14px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.tabs button.on{background:var(--blue);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:999px;font-weight:700;font-size:13px;background:#fff;border:1.5px solid var(--line);color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* language switch (flags) */
.lang{display:inline-flex;gap:3px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{display:flex;align-items:center;gap:6px;padding:4px 9px 4px 5px;border-radius:999px;font-weight:700;font-size:12px;color:var(--ink-2)}
.lang button.on{background:var(--blue-50);color:var(--blue-d)}
.lang .flag{width:22px;height:15px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.08);flex-shrink:0;display:block}
.lang button:not(.on) .flag{opacity:.75}

/* login */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px;position:relative;overflow:hidden;background:var(--bg)}
.login-wrap:before{content:"";position:absolute;inset:0 0 auto 0;height:46vh;background:var(--grad)}
.login-wrap:after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;right:-180px;top:-220px;background:rgba(255,255,255,.12)}
.login-card{position:relative;z-index:1;width:100%;max-width:410px;background:#fff;border-radius:22px;padding:22px 24px 26px;box-shadow:0 30px 60px -28px rgba(14,17,80,.45);text-align:center}
.login-card .lang{position:absolute;top:14px;right:14px}
.login-card .logo{width:190px;margin:26px auto 6px;display:block}
.login-card h1{font-size:21px}
.login-card form{display:flex;flex-direction:column;gap:12px;text-align:left;margin-top:18px}
.login-hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:14px}
.demo-box{margin-top:16px;background:var(--blue-50);border-radius:12px;padding:10px 12px;font-size:12.5px;text-align:left;color:var(--ink-2);line-height:1.6}
.demo-box b{color:var(--ink)}
.pw{position:relative}
.pw .icon-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:32px;height:32px}

/* app shell */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand img{width:40px;height:40px}
.brand b{font-family:var(--font-h);font-size:19px;display:block;line-height:1.1;color:var(--ink);font-weight:600}
.brand span{font-size:12px;color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;font-weight:600;color:var(--ink-2);text-align:left;width:100%;font-size:14.5px}
.nav-item svg{width:19px;height:19px;flex-shrink:0}
.nav-item:hover{background:var(--blue-50);color:var(--blue)}
.nav-item.on{background:var(--blue);color:#fff;box-shadow:0 8px 18px -10px rgba(26,92,240,.8)}
.nav-item .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:11px;padding:1px 7px;border-radius:999px}
.nav-item.on .cnt{background:#fff;color:var(--red)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 26px;position:sticky;top:0;z-index:20;background:rgba(245,248,255,.9);backdrop-filter:blur(8px)}
.topbar h2{font-size:21px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .menu-btn,.topbar .home-btn,.mobile-only{display:none!important}
.content{padding:6px 26px 48px;display:flex;flex-direction:column;gap:16px;max-width:1280px;width:100%}
.user-pill{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:4px 5px 4px 13px;border:1px solid var(--line);font-weight:700;font-size:13px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--blue-100);color:var(--blue-d);display:grid;place-items:center;font-family:var(--font-h);font-weight:600;font-size:12.5px;flex-shrink:0}
.mode-flag{position:fixed;bottom:12px;right:12px;pointer-events:none;z-index:80;background:var(--ink);color:#fff;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:999px;opacity:.85}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:60;transform:translateX(-105%);transition:transform .22s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(14,17,80,.35);z-index:55}
  .topbar{padding:10px 16px;gap:6px}
  .topbar .menu-btn,.topbar .home-btn{display:inline-grid!important}
  .nav-item.mobile-only{display:flex!important}
  .topbar h2{font-size:18px}
  .user-pill .nm{display:none}
  .user-pill{padding:3px}
  .content{padding:4px 16px 48px}
  .topbar .lang button span{display:none}
  .topbar .lang button{padding:4px}
}

/* hero + tiles */
.hero{background:var(--grad);border-radius:20px;padding:22px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden;color:#fff}
.hero .mark{width:66px;height:66px;border-radius:18px;background:#fff;display:grid;place-items:center;flex-shrink:0;position:relative;z-index:1}
.hero .mark img{width:50px}
.hero h2{font-size:22px;position:relative;z-index:1}
.hero p{opacity:.92;position:relative;z-index:1;font-size:14.5px}
.hero:after{content:"";position:absolute;right:-50px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero:before{content:"";position:absolute;right:90px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{border-radius:16px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;color:var(--ink);text-align:center;background:#fff;border:1px solid #E9EEF9;box-shadow:var(--shadow);transition:transform .12s}
.tile:hover{transform:translateY(-2px);border-color:var(--blue-200)}
.tile i{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--blue-50);color:var(--blue)}
.tile svg{width:24px;height:24px}
@media(max-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.tile{padding:13px 4px;font-size:12.5px;line-height:1.25}.tile i{width:40px;height:40px}.hero{padding:16px;gap:12px}.hero .mark{width:52px;height:52px}.hero .mark img{width:38px}.hero h2{font-size:18.5px}.hero p{font-size:13.5px}}

/* list items */
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .meta{min-width:0;flex:1}
.li .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .meta > span{display:block}
.li.click{cursor:pointer}
.li.click:hover .meta b{color:var(--blue)}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-weight:600}
.timebox{width:58px;flex-shrink:0;text-align:center;border-radius:12px;background:var(--blue-50);color:var(--blue-d);padding:6px 0;font-weight:800;font-size:13px;line-height:1.2}
.timebox small{display:block;font-weight:600;font-size:11px;color:var(--ink-2)}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:11px 13px;font-size:14px;font-weight:600}
.alert svg{width:19px;height:19px;flex-shrink:0;margin-top:1px}
.alert.red{background:var(--red-50);color:#9E2328}
.alert.yellow{background:var(--gold-50);color:#7A5900}
.alert.blue{background:var(--blue-50);color:var(--blue-d)}
.alert.green{background:var(--green-50);color:#0B6B46}

/* schedule — week view */
.wk-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wk-head h3{font-size:16px;margin:0 6px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:#fff;border:1px solid #E9EEF9;border-radius:14px;padding:8px;min-height:150px;display:flex;flex-direction:column;gap:6px;min-width:0}
.day.today{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-100)}
.day-h{display:flex;align-items:center;gap:4px;padding:2px 2px 4px}
.day-h b{font-family:var(--font-h);font-weight:600;font-size:13.5px}
.day-h span{font-size:12px;color:var(--muted)}
.day-h .icon-btn{width:26px;height:26px;margin-left:auto}
.day-h .icon-btn svg{width:16px;height:16px}
.lc{border-radius:10px;padding:7px 8px;background:var(--blue-50);border-left:3px solid var(--blue);cursor:pointer;font-size:12.5px;line-height:1.35;min-width:0}
.lc:hover{filter:brightness(.97)}
.lc .tm{font-weight:800;color:var(--blue-d)}
.lc b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.lc span{display:block;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc.Completed{background:var(--green-50);border-color:var(--green)}
.lc.Completed .tm{color:#0B7A4F}
.lc.Cancelled{background:#F1F2F6;border-color:#B7BCCE;opacity:.7}
.lc.Cancelled b{text-decoration:line-through}
.lc.late{background:var(--gold-50);border-color:var(--gold)}
.lc.late .tm{color:#8A6500}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media(max-width:1100px){
  .week{grid-template-columns:1fr}
  .day{min-height:0}
  .day:not(.has):not(.today) .day-h{padding-bottom:0}
}

/* availability */
.av-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.av-row:last-child{border-bottom:0}
.av-chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:200px}
.av-chip{font-size:12px;font-weight:700;padding:4px 9px;border-radius:8px;background:var(--cyan-50);color:#0A6F8C}
.slot-row{display:grid;grid-template-columns:1.3fr 1fr 1fr 36px;gap:8px;align-items:center;margin-bottom:8px}
.res{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res .meta{flex:1;min-width:0}
.res .meta b,.res .meta span{display:block}
.chk-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto;background:#FAFBFF;border:1px solid var(--line);border-radius:10px;padding:10px}
.chk-list div{font-size:13px;font-weight:600;display:flex;gap:8px;align-items:flex-start}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(14,17,80,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:36px 14px;overflow-y:auto}
.modal{background:#fff;border-radius:20px;width:100%;max-width:560px;box-shadow:0 30px 60px -20px rgba(0,0,0,.35);animation:pop .18s ease-out}
.modal.wide{max-width:820px}
.modal-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:18px;flex:1;min-width:0}
.modal-b{padding:18px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.toast.err{background:var(--red)}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:rgba(245,248,255,.55);z-index:150}
.spin{width:42px;height:42px;border-radius:50%;border:4px solid var(--blue-100);border-top-color:var(--blue);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{font-weight:600;min-width:0;overflow-wrap:anywhere}
.notif{display:flex;gap:12px;padding:12px;border-radius:14px;background:var(--blue-50);margin-bottom:10px;align-items:center}
.notif .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#fff;color:var(--blue);flex-shrink:0}
.notif .ico svg{width:21px;height:21px}
.notif .meta{flex:1;min-width:0}
.notif.y{background:var(--gold-50)} .notif.y .ico{color:#B98A00}
.notif.g{background:var(--green-50)} .notif.g .ico{color:var(--green)}
.notif.r{background:var(--red-50)} .notif.r .ico{color:var(--red)}

/* upload */
.drop{border:2px dashed var(--blue-200);border-radius:14px;padding:14px;text-align:center;color:var(--ink-2);font-weight:600;font-size:13.5px;cursor:pointer;background:#FAFCFF;display:block}
.drop:hover{border-color:var(--blue);color:var(--blue)}
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
.att{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#F6F8FD;aspect-ratio:4/3;display:grid;place-items:center;text-align:center;font-size:11.5px;font-weight:600;color:var(--ink-2);padding:4px}
.att img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.att .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(14,17,80,.7);color:#fff;display:grid;place-items:center;z-index:2}
.att .x svg{width:14px;height:14px}

/* ================= LESSON UPDATE REPORT (mirrors the PDF) ================= */
.rep{background:#fff;color:#1D2140;font-family:var(--font-b);max-width:780px;margin:0 auto}
.rep-pg{padding:34px 46px 20px;position:relative}
.rep-logo{display:block;width:120px;margin:0 auto 12px}
.rep-rule{height:3px;background:linear-gradient(90deg,#1A5CF0,#7B4DF2);border-radius:3px;margin-bottom:22px}
.rep h1{font-family:var(--font-b);font-weight:800;text-align:center;font-size:23px;letter-spacing:.5px;color:#1D2140}
.rep .sub{text-align:center;font-style:italic;color:#7B4DF2;font-size:15px;margin:2px 0 16px}
.rep-info{display:grid;grid-template-columns:1fr 1fr;gap:10px 30px;background:#EEF2FF;padding:12px 22px;margin-bottom:24px}
.rep-info small{display:block;text-transform:uppercase;font-size:10px;font-weight:800;letter-spacing:.6px;color:#7B4DF2}
.rep-info b{font-size:15.5px}
.rep-sec{margin-bottom:22px}
.rep-sec h2{font-family:var(--font-b);font-weight:800;font-size:15px;letter-spacing:.3px;padding-left:12px;border-left:6px solid #1A5CF0;margin-bottom:12px;color:#1D2140;line-height:1.5}
.rep-sec ul{padding-left:34px;font-size:14.5px;line-height:1.6}
.rep-sec li{margin-bottom:3px}
.rep-sec p{font-size:14.5px;line-height:1.6;padding-left:18px;white-space:pre-line;margin-bottom:10px}
.rep-imgs{display:flex;flex-direction:column;gap:14px;align-items:center;padding:0 10px}
.rep-imgs img{max-width:100%;max-height:520px;border-radius:2px;break-inside:avoid}
.rep-files{padding-left:18px;font-size:14px}
.rep-foot{text-align:center;margin-top:30px;padding-top:6px;border-top:2px solid;border-image:linear-gradient(90deg,#7B4DF2,#1A5CF0) 1;font-size:12.5px}
.rep-foot b{display:block;color:#7B4DF2;font-size:12px;letter-spacing:.5px}
.rep-empty{color:#9AA0BC;font-style:italic;padding-left:18px;font-size:14px}
@media(max-width:600px){.rep-pg{padding:22px 16px}.rep-info{grid-template-columns:1fr 1fr;padding:10px 12px;gap:8px 14px}.rep-sec ul{padding-left:22px}}

/* invoice document */
.inv-doc .rep-info{grid-template-columns:1fr 1fr}
.inv-tbl{width:100%;border-collapse:collapse;font-size:14px;margin:4px 0 14px}
.inv-tbl th{background:#1A5CF0;color:#fff;text-align:left;padding:9px 12px;font-size:12px;letter-spacing:.4px}
.inv-tbl td{padding:10px 12px;border-bottom:1px solid #E4EAF6}
.inv-tbl .r{text-align:right}
.inv-tot td{font-weight:800;font-size:16px;border-bottom:0;background:#EEF2FF}
.stamp{position:absolute;right:46px;top:150px;transform:rotate(-10deg);border:3px solid;border-radius:10px;padding:3px 12px;font-family:var(--font-h);font-weight:700;font-size:20px;letter-spacing:1px;opacity:.85}
.stamp.paid{color:var(--green);border-color:var(--green)}
.stamp.unpaid{color:var(--red);border-color:var(--red)}
@media(max-width:600px){.stamp{right:14px;top:120px;font-size:15px}}

@media print{
  body *{visibility:hidden}
  .print-area,.print-area *{visibility:visible}
  .print-area{position:absolute;left:0;top:0;width:100%}
}

/* ---------------- API ---------------- */
async function call(action, payload = {}, opts = {}) {
  const req = Object.assign({ action, token: S.token }, payload);
  if (!opts.silent) loading(true);
  try {
    let res;
    if (IS_GAS) {
      res = await new Promise((ok, ko) => google.script.run.withSuccessHandler(r => ok(JSON.parse(r))).withFailureHandler(ko).api(JSON.stringify(req)));
    } else if (DEMO) {
      await new Promise(r => setTimeout(r, 120));
      res = Mock.handle(JSON.parse(JSON.stringify(req)));
    } else {
      const r = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(req) });
      res = await r.json();
    }
    if (!res.ok) {
      if (res.error === 'SESSION') { logout(true); }
      throw new Error(errMsg(res.error));
    }
    return res;
  } finally { if (!opts.silent) loading(false); }
}
function errMsg(e) {
  e = String(e || '');
  if (e.startsWith('USERNAME_TAKEN:')) return t('e_username', e.slice(15));
  if (e.startsWith('CONFLICT:')) return t('e_conflict', e.slice(9));
  const k = 'e_' + e.toLowerCase();
  return L[k] ? t(k) : (e || t('e_generic'));
}

/* ---------------- helpers ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => 'Rp' + (Number(n) || 0).toLocaleString('id-ID');
const pad = n => String(n).padStart(2, '0');
const MONTHS = {
  en: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
  id: ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember']
};
const DAYS = { en: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'], id: ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'] };
const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0];
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const toDate = s => new Date(s + 'T00:00:00');
const todayStr = () => dstr(new Date());
const nowHM = () => { const n = new Date(); return `${pad(n.getHours())}:${pad(n.getMinutes())}`; };
const addDays = (s, n) => { const d = toDate(s); d.setDate(d.getDate() + n); return dstr(d); };
const mondayOf = s => { const d = toDate(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return dstr(d); };
const weekday = s => toDate(s).getDay();
const dayName = (i, short) => { const n = DAYS[LANG][i]; return short ? n.slice(0, 3) : n; };
const fmtDate = (s, long) => { if (!s) return '-'; const [y, m, d] = String(s).slice(0, 10).split('-'); if (!d) return s; const mn = MONTHS[LANG][+m - 1]; return `${+d} ${long ? mn : mn.slice(0, 3)} ${y}`; };
const fmtDay = s => `${dayName(weekday(s), true)}, ${fmtDate(s)}`;
const fmtPeriod = p => { if (!p) return '-'; const [y, m] = p.split('-'); return `${MONTHS[LANG][+m - 1]} ${y}`; };
const thisPeriod = () => todayStr().slice(0, 7);
const addMonths = (p, n) => { let [y, m] = p.split('-').map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad(m)}`; };
const mins = hm => { const p = String(hm || '').split(':'); return (+p[0] || 0) * 60 + (+p[1] || 0); };
const hmOf = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
const overlap = (a, b) => mins(a.start) < mins(b.end) && mins(b.start) < mins(a.end);
const initials = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(x => x[0]).join('').toUpperCase();
const sum = (arr, f) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const firstName = n => { const w = String(n || '').trim().split(/\s+/)[0] || ''; return w.charAt(0).toUpperCase() + w.slice(1); };
function formData(form) { const o = {}; new FormData(form).forEach((v, k) => o[k] = String(v).trim()); return o; }
function monthOptions(sel, back = 12, fwd = 2) {
  const cur = thisPeriod(); let out = '';
  for (let i = fwd; i >= -back; i--) { const p = addMonths(cur, i); out += `<option value="${p}" ${p === sel ? 'selected' : ''}>${fmtPeriod(p)}</option>`; }
  return out;
}

  let el = $('#toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.className = 'toast' + (err ? ' err' : ''); el.textContent = msg; el.style.display = 'block';

const D = tb => S.db[tb] || (S.db[tb] = []);
const byId = (tb, id) => D(tb).find(x => x.id === id);
const studentOf = id => byId('Students', id) || { id, name: '—' };
const tutorOf = id => byId('Tutors', id) || { id, name: '—' };

const studentsActive = () => D('Students').filter(s => s.status !== 'Inactive').sort((a, b) => a.name.localeCompare(b.name));
const tutorsActive = () => D('Tutors').filter(s => s.status !== 'Inactive').sort((a, b) => a.name.localeCompare(b.name));
const zoomsActive = () => D('Zooms').filter(z => z.status !== 'Inactive');
const lowBal = () => Number(S.settings.lowBalance) || 2;
const sortL = arr => arr.sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
function balance(sid) {
  const bought = sum(D('Invoices').filter(i => i.studentId === sid && i.status !== 'Cancelled'), i => i.sessions);
  const ls = D('Lessons').filter(l => l.studentId === sid);
  const used = ls.filter(l => l.status === 'Completed').length;
  const upcoming = ls.filter(l => l.status === 'Scheduled' && l.date >= todayStr()).length;
  return { bought, used, left: bought - used, upcoming };
}
const updateOf = lid => D('Updates').find(u => u.lessonId === lid);
const isPast = l => l.date < todayStr() || (l.date === todayStr() && mins(l.end) <= mins(nowHM()));
const isLate = l => l.status === 'Scheduled' && isPast(l);
/** completed (or finished-but-unconfirmed) lessons without a lesson update */
function pendingUpdates() {
  return sortL(D('Lessons').filter(l => l.status !== 'Cancelled' && (l.status === 'Completed' || isPast(l)) && !updateOf(l.id) && (S.role !== 'tutor' || l.tutorId === S.me.id))).reverse();
}
function conflictsOf(l, list = D('Lessons')) {
  const out = [];
  if (l.status === 'Cancelled') return out;
  list.forEach(o => {
    if (o.id === l.id || o.status === 'Cancelled' || o.date !== l.date || !overlap(o, l)) return;
    if (l.tutorId && o.tutorId === l.tutorId) out.push({ type: 'tutor', o });
    if (l.studentId && o.studentId === l.studentId) out.push({ type: 'student', o });
    if (l.zoomId && o.zoomId === l.zoomId) out.push({ type: 'zoom', o });
  });
  return out;
}
/** 'yes' = inside availability, 'no' = outside, 'unset' = tutor has no availability yet */
function tutorAvail(tid, date, start, end) {
  const rows = D('Availability').filter(a => a.tutorId === tid);
  if (!rows.length) return 'unset';
  const d = String(weekday(date));
  return rows.some(a => a.day === d && mins(a.start) <= mins(start) && mins(a.end) >= mins(end)) ? 'yes' : 'no';
}
function freeZoom(l, list = D('Lessons')) { return zoomsActive().find(z => !conflictsOf(Object.assign({}, l, { zoomId: z.id, tutorId: '', studentId: '' }), list).length); }
function replaceRows(tb, rows) { rows.forEach(r => { const i = D(tb).findIndex(x => x.id === r.id); i > -1 ? D(tb)[i] = r : D(tb).push(r); }); }
async function saveRow(tb, row) { const r = await call('save', { table: tb, row }); replaceRows(tb, [r.row]); return r.row; }
async function saveRows(tb, rows) { const r = await call('saveMany', { table: tb, rows }); replaceRows(tb, r.rows); return r.rows; }
async function removeRow(tb, id) { await call('remove', { table: tb, id }); S.db[tb] = D(tb).filter(x => x.id !== id); }

function weekNav(n) { S.week = n === 0 ? mondayOf(todayStr()) : addDays(S.week, n * 7); renderPage(); }
function weekView(list, opts = {}) {

  </div>`;
}
function lessonCard(l) {

}
function lessonLi(l, actions = '') {
  const z = zoomOf(l.zoomId);
  const who = S.role === 'admin' ? `${esc(studentOf(l.studentId).name)} · ${esc(tutorOf(l.tutorId).name)}` : S.role === 'tutor' ? esc(studentOf(l.studentId).name) : `${t('with')} ${esc(tutorOf(l.tutorId).name)}`;

}
function zoomBtn(l, sm) {

}
function lessonDetail(id) {

  const st = studentOf(l.studentId), z = zoomOf(l.zoomId), up = updateOf(l.id);
  const canWrite = S.role === 'admin' || (S.role === 'tutor' && l.tutorId === S.me.id);
  const body = `<dl class="kv">
      <dt>${t('date')}</dt><dd>${fmtDate(l.date, true)} (${dayName(weekday(l.date))})</dd>

      ${S.role !== 'tutor' ? `<dt>${t('tutor')}</dt><dd>${esc(tutorOf(l.tutorId).name)}</dd>` : ''}

      <dt>Zoom</dt><dd>${z ? `${esc(z.name)}${z.meetingId ? `<br><span class="small muted">ID ${esc(z.meetingId)}${z.passcode ? ' · ' + t('passcode') + ' ' + esc(z.passcode) : ''}</span>` : ''}` : '<span class="muted">—</span>'}</dd>
      <dt>${t('status')}</dt><dd>${isLate(l) ? `<span class="badge b-yellow">${t('needs_confirm')}</span>` : stBadge(l.status)}</dd>
      ${l.notes ? `<dt>${t('notes')}</dt><dd>${esc(l.notes)}</dd>` : ''}

  let foot = zoomBtn(l);

  if (S.role === 'tutor' && l.tutorId === S.me.id && l.status === 'Scheduled') foot += `<button class="btn green" onclick="tutorStatus('${l.id}','Completed')">${ic('check')}${t('mark_done')}</button>`;
  if (S.role === 'admin') {
    foot = `<button class="icon-btn" title="${t('delete')}" onclick="delLesson('${l.id}')">${ic('trash')}</button><div class="spacer"></div>` +
      (l.status !== 'Completed' ? `<button class="btn sm ghost" onclick="setLessonStatus('${l.id}','Completed')">${ic('check')}${t('mark_done')}</button>` : `<button class="btn sm ghost" onclick="setLessonStatus('${l.id}','Scheduled')">${t('mark_sched')}</button>`) +

async function tutorStatus(id, status) {
  try { const r = await call('lessonStatus', { id, status }); replaceRows('Lessons', [r.row]); closeModal(); toast(t('saved')); renderShell(); } catch (e) { toast(e.message, true); }
}

/* =========================================================
   LESSON FORM (admin) — with tutor / student / zoom conflict check
   ========================================================= */
function subjectsList() {
  const set = {};
  D('Students').forEach(s => String(s.subject || '').split(',').forEach(x => { x = x.trim(); if (x) set[x] = 1; }));
  D('Tutors').forEach(s => String(s.subjects || '').split(',').forEach(x => { x = x.trim(); if (x) set[x] = 1; }));
  return Object.keys(set).sort();
}
function lessonForm(id, date, pre = {}) {
  const l = id ? byId('Lessons', id) : Object.assign({ date: date || todayStr(), start: '16:00', end: hmOf(mins('16:00') + (Number(S.settings.lessonMinutes) || 60)), studentId: '', tutorId: '', subject: '', zoomId: 'auto', status: 'Scheduled', notes: '' }, pre);
  if (!id && pre.start && !pre.end) l.end = hmOf(mins(pre.start) + (Number(S.settings.lessonMinutes) || 60));
  S.lfId = id || null;
  const opt = (arr, sel, ph) => `<option value="">${ph}</option>` + arr.map(x => `<option value="${x.id}" ${x.id === sel ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
  modal(id ? t('edit_lesson') : t('add_lesson'), `<form id="fL" class="form-grid" oninput="lfCheck()" onchange="lfCheck()">
    <div class="field"><label>${t('student')} *</label><select class="input" name="studentId" required onchange="lfStudent(this.value)">${opt(id ? D('Students') : studentsActive(), l.studentId, t('choose'))}</select></div>
    <div class="field"><label>${t('tutor')} *</label><select class="input" name="tutorId" required>${opt(id ? D('Tutors') : tutorsActive(), l.tutorId, t('choose'))}</select></div>
    <div class="field"><label>${t('subject')}</label><input class="input" name="subject" list="subjList" value="${esc(l.subject)}"><datalist id="subjList">${subjectsList().map(s => `<option value="${esc(s)}">`).join('')}</datalist></div>
    <div class="field"><label>${t('date')} *</label><input class="input" type="date" name="date" value="${l.date}" required></div>
    <div class="field"><label>${t('start')} *</label><input class="input" type="time" name="start" value="${l.start}" required onchange="lfKeepDur()"></div>
    <div class="field"><label>${t('end')} *</label><input class="input" type="time" name="end" value="${l.end}" required></div>
    <div class="field full"><div class="chips">${[45, 60, 90, 120].map(m => `<button type="button" class="chip" onclick="lfDur(${m})">${m} ${t('min')}</button>`).join('')}</div></div>
    <div class="field"><label>Zoom</label><select class="input" name="zoomId"><option value="auto" ${l.zoomId === 'auto' ? 'selected' : ''}>${t('zoom_auto')}</option><option value="" ${l.zoomId === '' ? 'selected' : ''}>${t('no_zoom')}</option>${D('Zooms').map(z => `<option value="${z.id}" ${z.id === l.zoomId ? 'selected' : ''}>${esc(z.name)}</option>`).join('')}</select></div>
    ${id ? `<div class="field"><label>${t('status')}</label><select class="input" name="status">${['Scheduled', 'Completed', 'Cancelled'].map(s => `<option value="${s}" ${s === l.status ? 'selected' : ''}>${t('st_' + s.toLowerCase())}</option>`).join('')}</select></div>`
      : `<div class="field"><label>${t('repeat')}</label><select class="input" name="weeks">${[1, 2, 4, 6, 8, 10, 12, 16].map(n => `<option value="${n}">${n === 1 ? t('once') : t('n_weeks', n)}</option>`).join('')}</select></div>`}
    <div class="field full"><label>${t('notes')}</label><input class="input" name="notes" value="${esc(l.notes)}"></div>
    <div class="field full"><label>${t('check_title')}</label><div id="lfCheck" class="chk-list"></div></div>
  </form>`, `<button class="btn ghost" onclick="closeModal()">${t('cancel')}</button><button class="btn" id="lfSave" onclick="saveLesson()">${ic('check')}${t('save')}</button>`);
  lfCheck();
}
function lfStudent(sid) { const f = $('#fL'); const s = studentOf(sid); if (s && s.subject && !f.subject.value) f.subject.value = s.subject.split(',')[0].trim(); }
function lfDur(m) { const f = $('#fL'); f.end.value = hmOf(mins(f.start.value) + m); lfCheck(); }
function lfKeepDur() { /* keep current duration when start moves */ const f = $('#fL'); const d = mins(f.end.value) - mins(S.lfLastStart || f.start.value); if (S.lfLastStart && d > 0) f.end.value = hmOf(mins(f.start.value) + d); S.lfLastStart = f.start.value; lfCheck(); }
function lfPlan() {
  const f = formData($('#fL'));
  const weeks = S.lfId ? 1 : Number(f.weeks) || 1;
  const base = S.lfId ? byId('Lessons', S.lfId) : {};
  const groupId = !S.lfId && weeks > 1 ? 'G' + Date.now().toString(36) : (base.groupId || '');
  const plan = [], pool = D('Lessons').slice();
  for (let k = 0; k < weeks; k++) {
    const row = Object.assign({}, base, { date: addDays(f.date, 7 * k), start: f.start, end: f.end, studentId: f.studentId, tutorId: f.tutorId, subject: f.subject, zoomId: f.zoomId, status: f.status || base.status || 'Scheduled', notes: f.notes, groupId });
    if (!S.lfId) delete row.id;
    const msgs = []; let ok = !!(f.date && f.start && f.end && f.studentId && f.tutorId) && mins(f.end) > mins(f.start);
    if (row.zoomId === 'auto') { const z = freeZoom(row, pool); row.zoomId = z ? z.id : ''; if (z) msgs.push(['blue', `Zoom → ${esc(z.name)}`]); else if (zoomsActive().length) msgs.push(['yellow', t('no_free_zoom')]); }
    conflictsOf(row, pool).forEach(c => { ok = false; msgs.push(['red', t('busy_' + c.type, esc(c.type === 'student' ? tutorOf(c.o.tutorId).name : studentOf(c.o.studentId).name), timeRange(c.o))]); });
    if (row.tutorId) { const a = tutorAvail(row.tutorId, row.date, row.start, row.end); if (a === 'no') msgs.push(['yellow', t('outside_avail')]); }
    plan.push({ row, ok, msgs });
    if (ok) pool.push(Object.assign({ id: '__' + k }, row));
  }
  return plan;
}
function lfCheck() {
  const el = $('#lfCheck'); if (!el) return;
  const f = formData($('#fL'));
  if (!f.studentId || !f.tutorId || !f.date) { el.innerHTML = `<div class="muted">${t('check_fill')}</div>`; return; }
  if (mins(f.end) <= mins(f.start)) { el.innerHTML = `<div style="color:var(--red)">${t('e_lesson_time')}</div>`; return; }
  const plan = lfPlan();
  const col = { red: 'var(--red)', yellow: '#8A6500', blue: 'var(--blue-d)' };
  el.innerHTML = plan.map(p => `<div><span>${p.ok ? '✅' : '⛔'}</span><span><b>${fmtDay(p.row.date)} ${timeRange(p.row)}</b>${p.msgs.map(m => `<br><span style="color:${col[m[0]]}">${m[1]}</span>`).join('')}${p.ok && !p.msgs.length ? ` <span class="muted">— ${t('all_free')}</span>` : ''}</span></div>`).join('');
  const okN = plan.filter(p => p.ok).length;
  $('#lfSave').innerHTML = ic('check') + (plan.length > 1 ? t('save_n', okN) : t('save'));
}
async function saveLesson() {
  const form = $('#fL'); if (!form.reportValidity()) return;
  const plan = lfPlan(), ok = plan.filter(p => p.ok).map(p => p.row);
  if (!ok.length) return toast(t('e_all_conflict'), true);
  try {
    if (S.lfId) await saveRow('Lessons', ok[0]); else await saveRows('Lessons', ok);
    closeModal(); toast(plan.length > ok.length ? t('saved_skip', ok.length, plan.length - ok.length) : t('saved'));
    if (!S.lfId) S.week = mondayOf(ok[0].date);
    renderShell();
  } catch (e) { toast(e.message, true); }
}
async function setLessonStatus(id, status) {
  const l = byId('Lessons', id);
  try { await saveRow('Lessons', Object.assign({}, l, { status })); closeModal(); toast(t('saved')); renderShell(); } catch (e) { toast(e.message, true); }
}
function delLesson(id) {
  const l = byId('Lessons', id), up = updateOf(id);
  confirmBox(t('del_lesson_q', esc(studentOf(l.studentId).name), fmtDay(l.date)) + (up ? `<br><span class="small" style="color:var(--red)">${t('del_lesson_up')}</span>` : ''), async () => {
    try { if (up) await removeRow('Updates', up.id); await removeRow('Lessons', id); toast(t('deleted')); renderShell(); } catch (e) { toast(e.message, true); }
  });

/* =========================================================
   AVAILABILITY — finder, weekly slots, editor
   ========================================================= */
function availFinder() {
  const d = S.f.fd || todayStr(), s = S.f.fs || '16:00', e = S.f.fe || hmOf(mins(s) + (Number(S.settings.lessonMinutes) || 60));
  const probe = { id: '__probe', date: d, start: s, end: e, status: 'Scheduled' };
  const valid = mins(e) > mins(s);
  const tut = tutorsActive().map(tu => {
    const busy = valid ? conflictsOf(Object.assign({}, probe, { tutorId: tu.id })).filter(c => c.type === 'tutor') : [];
    const av = tutorAvail(tu.id, d, s, e);
    const rank = busy.length ? 3 : av === 'yes' ? 0 : av === 'unset' ? 1 : 2;
    return { tu, busy, av, rank };
  }).sort((a, b) => a.rank - b.rank || a.tu.name.localeCompare(b.tu.name));
  const zs = zoomsActive().map(z => ({ z, busy: valid ? conflictsOf(Object.assign({}, probe, { zoomId: z.id })).filter(c => c.type === 'zoom') : [] }));
  const badge = x => x.busy.length ? `<span class="badge b-red">${t('busy')}</span>` : x.av === 'yes' ? `<span class="badge b-green">${t('available')}</span>` : x.av === 'unset' ? `<span class="badge b-gray">${t('avail_unset')}</span>` : `<span class="badge b-yellow">${t('outside_avail_s')}</span>`;
  return `<div class="card"><div class="card-head"><h3>${ic('search', '').replace('<svg', '<svg style="width:18px;height:18px;vertical-align:-3px;margin-right:6px"')}${t('finder_title')}</h3></div>
    <div class="form-grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <div class="field"><label>${t('date')}</label><input class="input" type="date" value="${d}" onchange="setF('fd',this.value)"></div>
      <div class="field"><label>${t('start')}</label><input class="input" type="time" value="${s}" onchange="S.f.fe=hmOf(mins(this.value)+(mins(S.f.fe||'${e}')-mins(S.f.fs||'${s}')));setF('fs',this.value)"></div>
      <div class="field"><label>${t('end')}</label><input class="input" type="time" value="${e}" onchange="setF('fe',this.value)"></div>
    </div>
    <p class="small muted" style="margin:8px 0 4px">${dayName(weekday(d))}, ${fmtDate(d, true)} · ${s}–${e}</p>
    <div class="grid g2" style="margin-top:6px">
      <div><h4 style="font-size:14px;margin-bottom:4px">${t('tutors')}</h4>${tut.length ? tut.map(x => `<div class="res"><div class="avatar">${initials(x.tu.name)}</div><div class="meta"><b>${esc(x.tu.name)}</b><span class="small muted">${x.busy.length ? x.busy.map(c => `${esc(studentOf(c.o.studentId).name)} ${timeRange(c.o)}`).join(', ') : esc(x.tu.subjects || '')}</span></div>${badge(x)}${!x.busy.length ? `<button class="btn sm soft" onclick="lessonForm(null,'${d}',{tutorId:'${x.tu.id}',start:'${s}',end:'${e}'})">${t('book')}</button>` : ''}</div>`).join('') : `<div class="empty">${t('no_tutors')}</div>`}</div>
      <div><h4 style="font-size:14px;margin-bottom:4px">${t('zoom_rooms')}</h4>${zs.length ? zs.map(x => `<div class="res"><div class="avatar" style="background:#E6EEFF">${ic('video').replace('<svg', '<svg style="width:15px;height:15px"')}</div><div class="meta"><b>${esc(x.z.name)}</b><span class="small muted">${x.busy.length ? x.busy.map(c => `${esc(studentOf(c.o.studentId).name)} ${timeRange(c.o)}`).join(', ') : t('free_slot')}</span></div>${x.busy.length ? `<span class="badge b-red">${t('in_use')}</span>` : `<span class="badge b-green">${t('free')}</span>`}</div>`).join('') : `<div class="empty">${t('no_zoom_rooms')}</div>`}</div>
    </div></div>`;
}
function availChips(tid) {
  const rows = D('Availability').filter(a => a.tutorId === tid).sort((a, b) => (WEEK_ORDER.indexOf(+a.day) - WEEK_ORDER.indexOf(+b.day)) || a.start.localeCompare(b.start));
  return rows.length ? rows.map(a => `<span class="av-chip">${dayName(+a.day, true)} ${a.start}–${a.end}</span>`).join('') : `<span class="muted small">${t('avail_unset')}</span>`;
}
function availEditor(tid) {
  S.avTid = tid;
  S.avDraft = D('Availability').filter(a => a.tutorId === tid).map(a => ({ day: a.day, start: a.start, end: a.end }))
    .sort((a, b) => (WEEK_ORDER.indexOf(+a.day) - WEEK_ORDER.indexOf(+b.day)) || a.start.localeCompare(b.start));
  modal(`${t('avail_of')} ${esc(tutorOf(tid).name)}`, `<p class="small muted" style="margin-bottom:12px">${t('avail_help')}</p><div id="avRows"></div>
    <div class="row"><button class="btn sm soft" onclick="avAdd()">${ic('plus')}${t('add_slot')}</button><button class="btn sm ghost" onclick="avWeekdays()">${t('quick_weekdays')}</button></div>`,
    `<button class="btn ghost" onclick="closeModal()">${t('cancel')}</button><button class="btn" onclick="avSave()">${ic('check')}${t('save')}</button>`);
  avRender();
}
function avRender() {
  $('#avRows').innerHTML = S.avDraft.length ? S.avDraft.map((r, i) => `<div class="slot-row">
    <select class="input" onchange="S.avDraft[${i}].day=this.value">${WEEK_ORDER.map(d => `<option value="${d}" ${String(d) === String(r.day) ? 'selected' : ''}>${dayName(d)}</option>`).join('')}</select>
    <input class="input" type="time" value="${r.start}" onchange="S.avDraft[${i}].start=this.value">
    <input class="input" type="time" value="${r.end}" onchange="S.avDraft[${i}].end=this.value">
    <button class="icon-btn" onclick="S.avDraft.splice(${i},1);avRender()">${ic('trash')}</button></div>`).join('') : `<div class="empty" style="padding:12px">${t('avail_unset')}</div>`;
}
function avAdd() { const last = S.avDraft[S.avDraft.length - 1]; S.avDraft.push({ day: last ? String(WEEK_ORDER[(WEEK_ORDER.indexOf(+last.day) + 1) % 7]) : '1', start: last ? last.start : '14:00', end: last ? last.end : '20:00' }); avRender(); }
function avWeekdays() { const st = S.avDraft[0] ? S.avDraft[0].start : '14:00', en = S.avDraft[0] ? S.avDraft[0].end : '20:00'; S.avDraft = [1, 2, 3, 4, 5].map(d => ({ day: String(d), start: st, end: en })); avRender(); }
async function avSave() {
  const bad = S.avDraft.find(r => mins(r.end) <= mins(r.start));
  if (bad) return toast(t('e_lesson_time'), true);
  try {
    const r = S.role === 'admin' ? await call('setAvailability', { tutorId: S.avTid, rows: S.avDraft }) : await call('saveAvailability', { rows: S.avDraft });
    S.db.Availability = D('Availability').filter(a => a.tutorId !== S.avTid).concat(r.rows);
    closeModal(); toast(t('saved')); renderPage();
  } catch (e) { toast(e.message, true); }
}

function readB64(blob) { return new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = ko; r.readAsDataURL(blob); }); }
async function prepFile(f) {
  if (/^image\/(jpeg|png|webp|bmp)/.test(f.type)) {
    const url = URL.createObjectURL(f);
    try {
      const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.85));
      return { name: f.name.replace(/\.\w+$/, '') + '.jpg', mime: 'image/jpeg', data: await readB64(blob) };
    } finally { URL.revokeObjectURL(url); }
  }
  if (f.size > 10 * 1024 * 1024) throw new Error(t('e_file_big'));
  return { name: f.name, mime: f.type || 'application/octet-stream', data: await readB64(f) };
}
async function onFiles(input) {
  const files = [...input.files]; input.value = '';
  for (const f of files) {
    try { const p = await prepFile(f); const r = await call('upload', p); S.upDraft.attachments.push(r.file); renderAtt(); }
    catch (e) { toast(`${f.name}: ${e.message}`, true); }
  }
}

function clientNotices() {
  const T = todayStr(), TM = addDays(T, 1);

  sortL(D('Lessons').filter(l => l.status === 'Scheduled' && (l.date === TM || (l.date === T && mins(l.end) > mins(nowHM()))))).forEach(l => items.push({ k: 'lesson', l }));

  const ups = D('Updates').filter(u => String(u.created || u.date) > seen).sort((a, b) => String(b.created).localeCompare(String(a.created)));
  ups.slice(0, 3).forEach(u => items.push({ k: 'update', u }));
  D('Invoices').filter(i => i.status === 'Unpaid').forEach(i => items.push({ k: 'invoice', i }));
  const latest = D('Updates').reduce((m, u) => String(u.created || '') > m ? String(u.created) : m, seen);
  return { items, latest, newUpdates: ups.length };
}

    ${list.map(s => { const b = balance(s.id); return `<tr class="${b.left <= 0 && s.status !== 'Inactive' ? 'warn' : ''}"><td><a href="javascript:void 0" onclick="studentDetail('${s.id}')"><b>${esc(s.name)}</b></a>${s.status === 'Inactive' ? ' ' + stBadge('Inactive') : ''}<div class="small muted">${esc(s.school || '—')}</div></td>

}

  const low = rows.filter(x => x.b.left <= lowBal());
  return `<div class="alert blue">${ic('layers')}<div>${t('sessions_explain')}</div></div>
    <div class="grid g3">
      <div class="stat"><span class="lbl">${t('purchased')}</span><span class="val num">${sum(rows, x => x.b.bought)}</span><span class="sub">${t('all_active')}</span></div>
      <div class="stat" style="--c:var(--green)"><span class="lbl">${t('used')}</span><span class="val num">${sum(rows, x => x.b.used)}</span><span class="sub">${t('completed_lessons')}</span></div>
      <div class="stat" style="--c:var(--red)"><span class="lbl">${t('low_balance')}</span><span class="val num" style="color:var(--red)">${low.length}</span><span class="sub">${t('low_balance_sub', lowBal())}</span></div>
    </div>
    <div class="card"><div class="table-wrap"><table class="t"><thead><tr><th>${t('student')}</th><th class="c">${t('purchased')}</th><th class="c">${t('used')}</th><th class="c">${t('remaining')}</th><th class="c">${t('scheduled_ahead')}</th><th>${t('last_next')}</th><th></th></tr></thead><tbody>
    ${rows.map(({ s, b }) => { const ls = sortL(D('Lessons').filter(l => l.studentId === s.id)); const last = ls.filter(l => l.status === 'Completed').pop(); const next = ls.find(l => l.status === 'Scheduled' && l.date >= todayStr()); const after = b.left - b.upcoming;
      return `<tr class="${b.left <= 0 ? 'warn' : ''}"><td><a href="javascript:void 0" onclick="studentDetail('${s.id}')"><b>${esc(s.name)}</b></a><div class="small muted">${esc(s.subject || '')}</div></td><td class="c num">${b.bought}</td><td class="c num">${b.used}</td><td class="c">${balBadge(b)}</td>
      <td class="c num">${b.upcoming}${b.upcoming && after < 0 ? `<div class="small" style="color:var(--red);font-weight:700">${t('short_by', -after)}</div>` : ''}</td>

    </tbody></table></div></div>`;
}

/* ---------- invoices ---------- */

      <div class="stat" style="--c:var(--violet)"><span class="lbl">${t('sessions_sold')}</span><span class="val num">${sum(D('Invoices').filter(i => i.status !== 'Cancelled' && String(i.date).startsWith(p)), i => i.sessions)}</span><span class="sub">${fmtPeriod(p)}</span></div>

    <div class="field"><label>${t('status')}</label><select class="input" name="status" onchange="$('#paidBox').classList.toggle('hidden',this.value!=='Paid')">${['Unpaid', 'Paid', 'Cancelled'].map(x => `<option value="${x}" ${x === i.status ? 'selected' : ''}>${t('st_' + x.toLowerCase())}</option>`).join('')}</select></div>

function invStudent(sid) {
  const f = $('#fI'), s = studentOf(sid);
  const prev = D('Invoices').filter(x => x.studentId === sid).sort((a, b) => b.date.localeCompare(a.date))[0];
  if (prev) { f.description.value = prev.description; f.price.value = prev.price; f.sessions.value = prev.sessions; }
  else if (!f.description.value) f.description.value = `${(s.subject || '').split(',')[0].trim() || t('tutoring')} — ${t('n_sessions_pkg', f.sessions.value || 8)}`;
  invCalc();
}
function invTotal(f) { const q = Number(f.sessions) || 0, p = Number(f.price) || 0, d = Number(f.discount) || 0; return Math.max(0, (q || 1) * p - d); }
function invCalc() { const f = formData($('#fI')); $('#invTot').textContent = rp(invTotal(f)); }
async function saveInvoice(id) {
  const form = $('#fI'); if (!form.reportValidity()) return;
  const f = formData(form); f.total = String(invTotal(f));
  if (f.status !== 'Paid') { f.paidDate = ''; f.method = ''; }
  try { await saveRow('Invoices', Object.assign(id ? { id } : {}, f)); closeModal(); toast(t('saved')); renderShell(); } catch (e) { toast(e.message, true); }
}
function payForm(id) {

  return `${unpaid.length ? `<div class="alert red">${ic('wallet')}<div>${t('c_unpaid', unpaid.length, rp(sum(unpaid, i => i.total)))}<br><span style="font-weight:500">${t('i_pay_to')} <b>${esc(S.settings.bank || '-')}</b></span></div></div>` : `<div class="alert green">${ic('check')}<div>${t('c_all_paid')}</div></div>`}
  <div class="card">${list.length ? list.map(i => `<div class="li click" onclick="viewInvoice('${i.id}')"><div class="avatar" style="background:${i.status === 'Paid' ? 'var(--green-50)' : 'var(--red-50)'};color:${i.status === 'Paid' ? 'var(--green)' : 'var(--red)'}">${ic('file').replace('<svg', '<svg style="width:15px;height:15px"')}</div><div class="meta"><b>${esc(i.invoiceNo)} · ${rp(i.total)}</b><span class="small muted">${fmtDate(i.date)} · ${esc(i.description)}${i.status === 'Unpaid' ? ' · ' + t('i_due') + ' ' + fmtDate(i.dueDate) : ''}</span></div>${stBadge(i.status)}<button class="icon-btn" onclick="event.stopPropagation();printHtml(invoiceHtml(byId('Invoices','${i.id}')),'${esc(i.invoiceNo)}')">${ic('download')}</button></div>`).join('') : `<div class="empty">${t('no_invoices')}</div>`}</div>`;
}
